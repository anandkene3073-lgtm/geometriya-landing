<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometriya — Geometric Market Analysis</title>
    <meta name="description" content="A charting platform built entirely on geometric analysis — Gann, Fibonacci, Vortex, and Mitotic Scaling." />

    <!-- ── Link preview (Open Graph) ──
         WhatsApp, Telegram, Facebook and LinkedIn all read these; without
         them a shared link renders as a bare URL with no title, no image and
         nothing explaining what it is. That is what every Refer & Earn link
         looked like to the person receiving it.

         Absolute URLs are required — crawlers do not resolve relative paths.
         og:image is the hero chart at 960x671; WhatsApp crops toward 1.91:1,
         which a chart survives better than a layout with text near the edges.
         A purpose-made 1200x630 card would be sharper still. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geometriya" />
    <meta property="og:url" content="https://www.geometricalanalysis.com/" />
    <meta property="og:title" content="Geometriya — Geometric Market Analysis" />
    <meta property="og:description" content="Gann, Fibonacci, Vortex and Mitotic Scaling tools for NSE stocks. Start a free 30-day trial." />
    <meta property="og:image" content="https://www.geometricalanalysis.com/hero-chart-gann.jpg" />
    <meta property="og:image:width" content="960" />
    <meta property="og:image:height" content="671" />
    <meta property="og:image:alt" content="A Geometriya chart with Gann angles drawn over an NSE stock." />
    <meta property="og:locale" content="en_IN" />

    <!-- X/Twitter ignores Open Graph for card type, so it needs its own. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Geometriya — Geometric Market Analysis" />
    <meta name="twitter:description" content="Gann, Fibonacci, Vortex and Mitotic Scaling tools for NSE stocks. Start a free 30-day trial." />
    <meta name="twitter:image" content="https://www.geometricalanalysis.com/hero-chart-gann.jpg" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/geometriya-appicon.svg" />
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
