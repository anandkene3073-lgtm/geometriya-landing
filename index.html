<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometriya — Geometric Market Analysis</title>
    <meta name="description" content="A charting platform built on Mitotic Scaling — a unique method that draws geometry directly on your charts to spot turning points before they happen." />

    <!-- ── Link preview (Open Graph) ──
         WhatsApp, Telegram, Facebook and LinkedIn all read these; without
         them a shared link renders as a bare URL with no title, no image and
         nothing explaining what it is. That is what every Refer & Earn link
         looked like to the person receiving it.

         Absolute URLs are required — crawlers do not resolve relative paths.
         og:image is a purpose-made 1200x630 card (scripts/make-og-card.cjs),
         not a reused screenshot. Its layout is centred because small previews
         in some clients centre-crop toward a square; a left-aligned version
         lost the first third of every line when that happened. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geometriya" />
    <meta property="og:url" content="https://www.geometricalanalysis.com/" />
    <!-- og:title is deliberately shorter than <title>, and deliberately does
         NOT repeat the brand: the preview image is the wordmark, so a title
         reading "Geometriya — …" spends the most prominent line saying what
         the picture beside it already says. WhatsApp's compact preview allows
         roughly two short lines and truncates the rest.
         The description leads with Mitotic Scaling because that is the thing
         nobody else has. Gann and Fibonacci are in every charting package and
         say nothing about why this one is different. -->
    <meta property="og:title" content="Mitotic Scaling" />
    <meta property="og:description" content="A unique method that draws geometry directly on your charts to spot turning points before they happen. Free 30-day trial, then free forever." />
    <meta property="og:image" content="https://www.geometricalanalysis.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Geometriya — Mitotic Scaling: geometry drawn directly on your charts." />
    <meta property="og:locale" content="en_IN" />

    <!-- X/Twitter ignores Open Graph for card type, so it needs its own. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mitotic Scaling" />
    <meta name="twitter:description" content="A unique method that draws geometry directly on your charts to spot turning points before they happen. Free 30-day trial, then free forever." />
    <meta name="twitter:image" content="https://www.geometricalanalysis.com/og-card.png" />

    <!-- Structured data. Static, not generated from the page, so it must stay
         limited to facts that do not drift: who we are and what the product is.
         Deliberately NO Offer and NO aggregateRating — prices come from
         /api/payment/plan-info at runtime and there are no collected reviews,
         so either would be markup asserting something the page does not show.
         Mismatched structured data is penalised, not ignored.
         An FAQPage block is also deliberately absent: the FAQ lives in
         GeometriyaLanding.jsx, and a hand-copied duplicate here would silently
         stop matching it the first time the copy is edited. Worth adding only
         if it is generated from the same source. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.geometricalanalysis.com/#organization",
          "name": "Geometriya",
          "alternateName": "Geometrical Analysis",
          "url": "https://www.geometricalanalysis.com/",
          "logo": "https://www.geometricalanalysis.com/logo.png",
          "email": "geometriya.analysis@gmail.com",
          "areaServed": "IN"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.geometricalanalysis.com/#website",
          "url": "https://www.geometricalanalysis.com/",
          "name": "Geometriya",
          "publisher": { "@id": "https://www.geometricalanalysis.com/#organization" },
          "inLanguage": "en-IN"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Geometriya",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "Web, Android",
          "url": "https://app.geometricalanalysis.com/",
          "publisher": { "@id": "https://www.geometricalanalysis.com/#organization" },
          "description": "A charting platform built on Mitotic Scaling — geometry drawn directly on price charts, with Dream-45 angles, Gann tools and Elliott wave counting for NSE stocks."
        }
      ]
    }
    </script>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/geometriya-appicon.svg" />
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
